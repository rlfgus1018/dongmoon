[project]
name = "dongmoon"
version = "0.1.0"
description = "A Django app for solo product development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.12,<1.0",
    "whitenoise>=6.9,<7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
