{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}dongmoon{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body class="min-h-screen bg-stone-50 text-neutral-950">
    <header class="border-b border-neutral-200 bg-white">
      <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-5">
        <a class="font-semibold tracking-tight" href="{% url 'core:home' %}">dongmoon</a>
        <nav class="flex items-center gap-4 text-sm text-neutral-600">
          <a class="hover:text-neutral-950" href="{% url 'core:school_search' %}">학교 찾기</a>
          {% if request.user.is_authenticated %}
            <a class="hidden text-neutral-500 hover:text-neutral-950 sm:inline" href="{% url 'accounts:mypage' %}">{{ request.user.username }}</a>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button class="hover:text-neutral-950" type="submit">로그아웃</button>
            </form>
          {% else %}
            <a class="hover:text-neutral-950" href="{% url 'accounts:login' %}">로그인</a>
            <a class="rounded-md bg-neutral-950 px-3 py-2 font-medium text-white hover:bg-neutral-800" href="{% url 'accounts:signup' %}">회원가입</a>
          {% endif %}
          <a class="hover:text-neutral-950" href="/admin/">Admin</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-5 py-10">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
